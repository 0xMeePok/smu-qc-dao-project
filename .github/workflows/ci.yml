name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      firebase: ${{ steps.filter.outputs.firebase }}
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Skip jobs whose trees are untouched so a docs/contracts PR is not blocked
      # by frontend or Cloud Functions tests. Changing this workflow re-runs every
      # job so the filters themselves stay verified.
      - name: Filter paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            firebase:
              - 'firebase/**'
              - '!firebase/functions/**'
              - '.github/workflows/ci.yml'
            functions:
              - 'firebase/functions/**'
              - 'firebase/firebase.json'
              - '.github/workflows/ci.yml'

  test:
    name: Run Unit & Integration Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Run build smoke test
        run: npm run build

  firebase-test:
    name: Run Firestore Rules Tests
    needs: changes
    if: needs.changes.outputs.firebase == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./firebase

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: firebase/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  functions-test:
    name: Run Cloud Functions Tests
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./firebase/functions

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run Cloud Functions test suite
        run: npm test

  # Always runs so a skipped functions/frontend job is not treated as a failed
  # required check. Fail only when a selected job actually failed or was cancelled.
  ci:
    name: CI
    needs: [changes, test, firebase-test, functions-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check selected jobs
        run: |
          changes="${{ needs.changes.result }}"
          frontend="${{ needs.test.result }}"
          firebase="${{ needs.firebase-test.result }}"
          functions="${{ needs.functions-test.result }}"
          echo "changes=$changes frontend=$frontend firebase=$firebase functions=$functions"
          if [ "$changes" != "success" ]; then
            exit 1
          fi
          for result in "$frontend" "$firebase" "$functions"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done
