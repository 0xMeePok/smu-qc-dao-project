title = "QCDAO"

# Keep the default rule set and carve out the known false positives below.
# .gitleaksignore fingerprints are commit-SHA specific; this allowlist applies
# to every commit that still contains those example files.
[extend]
useDefault = true

[[allowlists]]
description = "Public Arbitrum Sepolia token addresses in faucet examples and tests, not live secrets"
paths = [
  '''(^|/)contracts/stable-faucet/site/\.env\.example$''',
  '''(^|/)contracts/stable-faucet/site/tests/api\.test\.ts$''',
]

[[allowlists]]
description = "Public token-policy factory addresses in the verified 2026-10-09 testnet deployment, not API tokens"
condition = "AND"
paths = [
  '''^(frontend/src/config|firebase/functions)/independentFunding\.contract\.json$''',
  '''^contracts/funding-escrow/deployments/(independent-arbitrumSepolia-1791551956766|independent-config-20261008|runtime-verification-20261009)\.json$''',
]
regexTarget = "line"
regexes = ['''^\s*"tokenRegistryAddress":\s*"0x[0-9a-fA-F]{40}",?\s*$''']
